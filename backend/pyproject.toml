[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novelista-v3-backend"
version = "3.0.0"
description = "Novelista v3: Local-first BYOK fiction studio & KDP publishing pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-docx>=1.1",
    "fpdf2>=2.8",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: requires a running local or cloud LLM endpoint"]
